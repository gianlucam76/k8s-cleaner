# This Cleaner instance finds all image-pull Secrets (type
# kubernetes.io/dockerconfigjson or kubernetes.io/dockercfg), in any
# namespace, that are not referenced by any ServiceAccount's
# imagePullSecrets or any Pod's spec.imagePullSecrets.
# These accumulate quickly in namespaces provisioned by CI tooling, since
# they're rarely cleaned up when a registry credential rotates or a
# pipeline is decommissioned.
apiVersion: apps.projectsveltos.io/v1alpha1
kind: Cleaner
metadata:
  name: unused-image-pull-secrets
spec:
  schedule: "* 0 * * *"
  action: Scan
  resourcePolicySet:
    resourceSelectors:
    - kind: Secret
      group: ""
      version: v1
    - kind: ServiceAccount
      group: ""
      version: v1
    - kind: Pod
      group: ""
      version: v1
    aggregatedSelection: |
      function getKey(namespace, name)
        return namespace .. ":" .. name
      end

      function isImagePullSecret(secret)
        return secret.type == "kubernetes.io/dockerconfigjson" or secret.type == "kubernetes.io/dockercfg"
      end

      function evaluate()
        local hs = {}
        hs.message = ""

        local pullSecrets = {}
        local usedSecrets = {}

        for _, resource in ipairs(resources) do
          local kind = resource.kind
          if kind == "Secret" then
            if isImagePullSecret(resource) then
              table.insert(pullSecrets, resource)
            end
          elseif kind == "ServiceAccount" then
            if resource.imagePullSecrets ~= nil then
              for _, ref in ipairs(resource.imagePullSecrets) do
                key = getKey(resource.metadata.namespace, ref.name)
                usedSecrets[key] = true
              end
            end
          elseif kind == "Pod" then
            if resource.spec.imagePullSecrets ~= nil then
              for _, ref in ipairs(resource.spec.imagePullSecrets) do
                key = getKey(resource.metadata.namespace, ref.name)
                usedSecrets[key] = true
              end
            end
          end
        end

        local unusedPullSecrets = {}

        for _, secret in ipairs(pullSecrets) do
          key = getKey(secret.metadata.namespace, secret.metadata.name)
          if not usedSecrets[key] then
            table.insert(unusedPullSecrets, {resource = secret})
          end
        end

        if #unusedPullSecrets > 0 then
          hs.resources = unusedPullSecrets
        end
        return hs
      end
