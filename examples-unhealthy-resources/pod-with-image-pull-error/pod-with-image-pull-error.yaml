# This Cleaner instance finds all Pods, in any namespace, with at least one
# container stuck unable to pull its image (ImagePullBackOff or ErrImagePull).
# Common causes: a wrong image tag, a missing/renamed image, or missing
# registry credentials.
apiVersion: apps.projectsveltos.io/v1alpha1
kind: Cleaner
metadata:
  name: image-pull-error-pods
spec:
  schedule: "*/5 * * * *"
  action: Scan
  notifications:
  - name: report
    type: CleanerReport
  resourcePolicySet:
    resourceSelectors:
    - kind: Pod
      group: ""
      version: v1
      excludeDeleted: false
      evaluate: |
        function evaluate()
          hs = {}
          hs.matching = false

          if obj.status ~= nil and obj.status.containerStatuses ~= nil then
            for _, containerStatus in ipairs(obj.status.containerStatuses) do
              if containerStatus.state ~= nil and containerStatus.state.waiting ~= nil and
                 (containerStatus.state.waiting.reason == "ImagePullBackOff" or
                  containerStatus.state.waiting.reason == "ErrImagePull") then
                hs.matching = true
                break
              end
            end
          end

          return hs
        end
